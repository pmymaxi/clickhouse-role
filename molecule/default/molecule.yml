---
# Dependency management (download roles/collections)
dependency:
  name: galaxy
  options:
    role-file: ${MOLECULE_SCENARIO_DIRECTORY}/role-requirements.yml
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml

platforms:
  - name: clickhouse-01
    image: clickhouse/clickhouse-server:latest
    published_ports:
      - "9001:9000"
      - "9010:9009"
      - "8125:8123"
    env:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin

  - name: web-01
    image: oraclelinux:9
    published_ports:
      - "8083:80"
    env:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin

  - name: lighthouse-01
    image: ubuntu:latest
    published_ports:
      - "8081:80"

provisioner:
  inventory:
    hosts:
      all:
        children:
          clickhouse:
            hosts:
              clickhouse-01:
          vector:
            hosts:
              web-01:
          lighthouse:
            hosts:
              lighthouse-01:
          nginx:
            hosts:
              web-01:
              lighthouse-01:
          website:
            hosts:
              web-01:
          firewall:
            hosts:
              clickhouse-01:
              web-01:
              lighthouse-01:

ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
      collections_paths: ~/.ansible/collections:/usr/share/ansible/collections
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../:${HOME}/.ansible/roles"
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"

  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
        - --force-handlers

  playbooks:
    create: create.yml
    converge: converge.yml
    destroy: destroy.yml
    cleanup: cleanup.yml
    prepare: prepare.yml
    verify: verify.yml

scenario:
  name: log_stack
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
